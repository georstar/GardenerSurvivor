<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Gardener Survivor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="xpbar"><div id="xpfill"></div><span id="lvl">LV 1</span></div>
    <div id="topbar">
      <div id="inventory">
        <div id="inv-weapons" class="inv-row"></div>
        <div id="inv-passives" class="inv-row"></div>
      </div>
      <div id="timer">00:00</div>
      <div id="right">
        <div id="kills">0 plants pruned</div>
        <button id="pausebtn" aria-label="Pause">II</button>
      </div>
    </div>
    <div id="bossbar" class="hidden">
      <div class="bossname">Mutant Sunflower</div>
      <div class="bossouter"><div id="bossfill"></div></div>
    </div>
    <div id="banner"></div>
  </div>

  <div id="overlay"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
